<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RentPro on Android</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Inter, "Segoe UI", sans-serif; }
  body { background: radial-gradient(circle at 80% 20%, #6d5dfc 0%, #4338ca 45%, #1e1b4b 100%); color: #fff;
         display: flex; align-items: center; justify-content: center; gap: 90px; }
  .copy { max-width: 430px; }
  .copy h2 { font-size: 54px; font-weight: 800; margin: 0 0 16px; letter-spacing: -1px; }
  .copy p { font-size: 22px; line-height: 1.5; opacity: .9; margin: 0; }
  .phone { width: 330px; height: 673px; border-radius: 46px; background: #0b0b14; padding: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 2px #2a2a3a; position: relative; }
  .phone::before { content: ""; position: absolute; top: 20px; left: 50%; width: 90px; height: 22px; margin-left: -45px; border-radius: 12px; background: #0b0b14; z-index: 2; }
  .screen { width: 390px; height: 795px; border: 0; border-radius: 36px; transform: scale(0.8462); transform-origin: 0 0; background: #fff; }
  .clip { width: 330px; height: 673px; border-radius: 36px; overflow: hidden; }
</style>
</head>
<body>
  <div class="copy">
    <h2>RentPro for Android</h2>
    <p>The same features in your pocket: dashboard, tenants, payments, reminders and the AI assistant.</p>
  </div>
  <div class="phone"><div class="clip"><iframe class="screen" id="screen" src="/dashboard.html"></iframe></div></div>
</body>
</html>
