<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RentPro — Archives</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root { 
        --rp-primary: #2563eb; 
        --rp-bg: #f8fafc; 
        --rp-dark: #0f172a; 
        --rp-card-border: #e2e8f0;
        --rp-danger: #ef4444;
        --rp-success: #22c55e;
    }
    body { background: var(--rp-bg); font-family: 'Inter', system-ui, sans-serif; color: #334155; }

    /* --- REUSED HEADER STYLES --- */
    .top-header {
        background: var(--rp-dark);
        padding: 15px 5%;
        display: flex; justify-content: space-between; align-items: center;
        position: sticky; top: 0; z-index: 1000;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .brand-logo { color: white; font-weight: 700; font-size: 1.25rem; text-decoration: none; }
    .nav-btn { color: white; opacity: 0.8; text-decoration: none; font-size: 0.9rem; margin-left: 20px; transition: 0.2s; }
    .nav-btn:hover { opacity: 1; color: #fff; }

    /* --- ARCHIVE SPECIFIC STYLES --- */
    .content { padding: 30px 5%; max-width: 1400px; margin: 0 auto; }
    
    .card-table { 
        background: #fff; border: 1px solid var(--rp-card-border); 
        border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); overflow: hidden; 
    }
    
    .table thead th { 
        background: #f1f5f9; color: #64748b; font-size: 0.75rem; text-transform: uppercase; 
        padding: 16px; border-bottom: 1px solid var(--rp-card-border); 
    }
    .table tbody td { padding: 16px; vertical-align: middle; border-bottom: 1px solid var(--rp-card-border); }
    .table-hover tbody tr:hover { background-color: #f8fafc; cursor: pointer; }

    /* Modal Styles */
    .modal-header { background: var(--rp-bg); border-bottom: 1px solid var(--rp-card-border); }
    .history-section-title { 
        font-size: 0.85rem; font-weight: 700; text-transform: uppercase; 
        color: #64748b; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
    }
    .history-card { 
        background: #fff; border: 1px solid var(--rp-card-border); 
        border-radius: 8px; padding: 15px; height: 100%; 
    }
    .scroll-box { max-height: 300px; overflow-y: auto; }

    /* Timeline Items */
    .timeline-item { 
        display: flex; justify-content: space-between; 
        padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; 
    }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-date { color: #94a3b8; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header class="top-header">
    <a href="tenants.html" class="brand-logo"><i class="fa-solid fa-building me-2"></i> RentPro</a>
    <nav>
        <a href="tenants.html" class="nav-btn"><i class="fa-solid fa-arrow-left me-1"></i> Back to Tenants</a>
    </nav>
  </header>

  <main class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold text-dark mb-1"><i class="fa-solid fa-box-archive text-muted me-2"></i>Deleted Tenants</h2>
        <p class="text-muted small mb-0">Records stored for 1 year. Click a row to view full history & repairs.</p>
      </div>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadArchives()">
        <i class="fa-solid fa-rotate me-1"></i> Refresh
      </button>
    </div>

    <div class="card-table">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Tenant Name</th>
              <th>National ID</th>
              <th>House Occupied</th>
              <th>Date Deleted</th>
              <th>Balance Left</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="archiveTableBody">
             <tr><td colspan="6" class="text-center p-5 text-muted"><i class="fa-solid fa-spinner fa-spin me-2"></i>Loading archives...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-xl"> <div class="modal-content">
        <div class="modal-header">
           <div>
               <h5 class="modal-title fw-bold" id="modalTenantName">Tenant Name</h5>
               <span class="badge bg-secondary" id="modalHouse">House ??</span>
               <span class="text-muted small ms-2" id="modalDates">Deleted: ...</span>
           </div>
           <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body bg-light">
           <div class="row g-4">
               
               <div class="col-md-6">
                   <div class="history-section-title"><i class="fa-solid fa-money-bill-wave text-success"></i> Payment History</div>
                   <div class="history-card scroll-box" id="paymentLog">
                       </div>
               </div>

               <div class="col-md-6">
                   <div class="history-section-title"><i class="fa-solid fa-screwdriver-wrench text-danger"></i> House Repairs</div>
                   <div class="history-card scroll-box" id="repairLog">
                        </div>
               </div>

           </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="global.js"></script>

  <script>
    // 🔴 YOUR WEB APP URL
    const API_URL = window.API_URL;

    // Global Data Store
    let allArchives = [];
    let allPayments = [];
    let allRepairs = [];

    // --- 1. LOAD DATA ---
    async function loadArchives() {
        try {
            const tbody = document.getElementById('archiveTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center p-4"><div class="spinner-border text-primary" role="status"></div></td></tr>';

            // Fetch everything in one go
            const res = await fetch(`${API_URL}?action=getArchivedData`);
            const json = await res.json();
            
            allArchives = json.archives || [];
            allPayments = json.payments || [];
            allRepairs = json.repairs || [];

            renderTable();

        } catch (e) {
            console.error(e);
            document.getElementById('archiveTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error loading data.</td></tr>`;
        }
    }

    // --- 2. RENDER TABLE ---
    function renderTable() {
        const tbody = document.getElementById('archiveTableBody');
        tbody.innerHTML = "";

        if (allArchives.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center p-5 text-muted">No archived tenants found.</td></tr>`;
            return;
        }

        allArchives.forEach(t => {
            // Calculate proper balance (Rent - Paid) if available in archive columns
            // Adjust indices based on your exact Archive Sheet layout
            // Assuming "Archived Date" is the last column pushed
            const delDate = t['Archived Date'] ? new Date(t['Archived Date']).toLocaleDateString() : 'N/A';
            const balance = (Number(t.Rent) || 0) - (Number(t.AmountPaid) || 0);
            
            // We use encodeURIComponent to pass safe data
            tbody.innerHTML += `
                <tr onclick="openHistory('${t.Name}', '${t.House}', '${delDate}')">
                    <td class="fw-bold">${t.Name}</td>
                    <td>${t.NationalID || '-'}</td>
                    <td><span class="badge bg-light text-dark border">House ${t.House}</span></td>
                    <td class="text-muted small">${delDate}</td>
                    <td class="${balance > 0 ? 'text-danger fw-bold' : 'text-success'}">
                        KES ${balance.toLocaleString()}
                    </td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-light border"><i class="fa-solid fa-eye"></i> Details</button>
                    </td>
                </tr>
            `;
        });
    }

    // --- 3. OPEN MODAL & FILTER LOGS ---
    window.openHistory = (name, house, date) => {
        // Update Modal Header
        document.getElementById('modalTenantName').innerText = name;
        document.getElementById('modalHouse').innerText = "House " + house;
        document.getElementById('modalDates').innerText = "Deleted: " + date;

        // A. Filter Payments (Matching Name or House)
        const tenantPayments = allPayments.filter(p => 
            String(p.tenant).toLowerCase().includes(name.toLowerCase()) || 
            String(p.house) == String(house) // Loose match for house
        );

        // B. Filter Repairs (Strictly matching House)
        const houseRepairs = allRepairs.filter(r => String(r.house) == String(house));

        // Render Payments
        const payContainer = document.getElementById('paymentLog');
        payContainer.innerHTML = "";
        if(tenantPayments.length === 0) {
            payContainer.innerHTML = "<p class='text-muted small text-center mt-3'>No payments recorded.</p>";
        } else {
            tenantPayments.forEach(p => {
                const pDate = new Date(p.date).toLocaleDateString();
                payContainer.innerHTML += `
                    <div class="timeline-item">
                        <div>
                            <div class="fw-medium">${p.method || 'Cash'}</div>
                            <div class="timeline-date">${pDate}</div>
                        </div>
                        <div class="fw-bold text-success">+ ${Number(p.amount).toLocaleString()}</div>
                    </div>
                `;
            });
        }

        // Render Repairs
        const repairContainer = document.getElementById('repairLog');
        repairContainer.innerHTML = "";
        if(houseRepairs.length === 0) {
            repairContainer.innerHTML = "<p class='text-muted small text-center mt-3'>No repairs found for House " + house + ".</p>";
        } else {
            houseRepairs.forEach(r => {
                const rDate = new Date(r.date).toLocaleDateString();
                repairContainer.innerHTML += `
                    <div class="timeline-item">
                        <div>
                            <div class="fw-medium">${r.item}</div>
                            <div class="timeline-date">${rDate}</div>
                        </div>
                        <div class="fw-bold text-danger">- ${Number(r.cost).toLocaleString()}</div>
                    </div>
                `;
            });
        }

        // Show Modal
        new bootstrap.Modal(document.getElementById('historyModal')).show();
    };

    // Load on start
    loadArchives();

  </script>
</body>
</html>
