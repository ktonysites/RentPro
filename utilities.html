<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RentPro — Utilities</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c1022">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body data-page="utilities">
  <script src="js/splash.js"></script>
  <script src="js/shell.js"></script>

  <main class="content">
    <div class="page-head">
      <div>
        <h2 class="fw-bold mb-1">Utility Bills</h2>
        <p class="text-muted small m-0">Track Water (120) & Garbage (150) payments.</p>
      </div>
      <div class="page-actions">
        <button id="generateBillsBtn" class="btn btn-primary">
          <i class="fa-solid fa-plus-circle me-2"></i> Generate This Month's Bills
        </button>
      </div>
    </div>

    <div class="row mb-2">
        <div class="col-md-6 col-xl-4">
            <div class="card-stat">
                <div>
                    <div class="card-label">Total Unpaid Utilities</div>
                    <h3 class="card-value text-danger" id="totalUnpaid">KES 0</h3>
                </div>
                <div class="icon-box bg-blue-light"><i class="fa-solid fa-faucet-drip"></i></div>
            </div>
        </div>
    </div>

    <div class="card-table">
      <div class="table-wrap">
      <table class="table table-stack table-hover mb-0 align-middle">
        <thead class="bg-light">
          <tr>
            <th class="ps-4">House</th>
            <th>Tenant Name</th>
            <th>Month</th>
            <th>Water (120)</th>
            <th>Garbage (150)</th>
            <th>Total Due</th>
            <th>Status</th>
            <th class="text-end pe-4">Action</th>
          </tr>
        </thead>
        <tbody id="billsTableBody">
          <tr><td colspan="8" class="text-center p-5 text-muted"><i class="fa-solid fa-spinner fa-spin me-2"></i> Loading...</td></tr>
        </tbody>
      </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="global.js"></script>
  <script src="js/dev-auth.js"></script>
  <script type="module" src="js/require-auth.js"></script>
  <script type="module">
    // 🔴 CHANGE THIS TO YOUR WEB APP URL
    const WEB_APP_URL = window.API_URL;

    async function apiWrite(payload) {
      const url = new URL(WEB_APP_URL);
      Object.entries(payload).forEach(([key, value]) => url.searchParams.set(key, value));
      const response = await fetch(url.toString());
      const result = await response.json();
      if (!result.success) throw new Error(result.message || 'Request failed.');
      return result;
    }

    // Load Data on Start
    loadBills();

    async function loadBills() {
        try {
            const res = await fetch(`${WEB_APP_URL}?action=getUtilityBills`);
            const json = await res.json();
            renderTable(json.data);
        } catch(e) {
            console.error(e);
            alert("Error loading bills.");
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('billsTableBody');
        tbody.innerHTML = "";
        let totalDue = 0;

        // SAFEGUARD: If data is missing/undefined, treat it as an empty list
        if (!data || !Array.isArray(data) || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center p-5 text-muted">No bills found (or check if Backend is Deployed).</td></tr>`;
            document.getElementById('totalUnpaid').innerText = "KES 0";
            return;
        }

        data.forEach(item => {
            // Ensure numbers are treated as numbers
            const water = Number(item.Water) || 0;
            const garbage = Number(item.Garbage) || 0;
            const total = water + garbage;

            if(item.Status === "Unpaid") totalDue += total;
            
            const badge = item.Status === "Paid" 
                ? `<span class="badge-paid">PAID</span>` 
                : `<span class="badge-unpaid">UNPAID</span>`;

            const btn = item.Status === "Unpaid"
                ? `<button class="btn btn-sm btn-outline-success" onclick="markPaid('${encodeURIComponent(item.ID).replace(/'/g, '%27')}')">Mark Paid</button>`
                : `<button class="btn btn-sm btn-light text-muted" disabled>Paid</button>`;

            tbody.innerHTML += `
                <tr>
                    <td class="td-primary ps-4 fw-bold">House ${escapeHtml(item.House)}</td>
                    <td data-label="Tenant">${escapeHtml(item.TenantName)}</td>
                    <td data-label="Month">${escapeHtml(item.Month)}</td>
                    <td data-label="Water">${water}</td>
                    <td data-label="Garbage">${garbage}</td>
                    <td data-label="Total" class="fw-bold">KES ${total}</td>
                    <td data-label="Status">${badge}</td>
                    <td class="text-end pe-4 td-actions">${btn}</td>
                </tr>
            `;
        });
        document.getElementById('totalUnpaid').innerText = "KES " + totalDue.toLocaleString();
    }
    // Generate Bills Logic
    document.getElementById('generateBillsBtn').addEventListener('click', async () => {
        if(!confirm("Generate bills for ALL tenants for this month?")) return;
        
        const btn = document.getElementById('generateBillsBtn');
        btn.disabled = true; btn.innerText = "Processing...";

        try {
            await apiWrite({ action: "generateMonthlyUtilities" });
            alert("Bills Generated Successfully!");
            loadBills();
        } catch(e) { alert("Error generating."); }
        finally { btn.disabled = false; btn.innerText = "Generate This Month's Bills"; }
    });

    // Mark Paid Logic
    window.markPaid = async (id) => {
        if(!confirm("Mark this bill as PAID?")) return;
        try {
            await apiWrite({ action: "payUtilityBill", id: decodeURIComponent(id) });
            loadBills();
        } catch(e) { alert("Error updating."); }
    };
  </script>
</body>
</html>
