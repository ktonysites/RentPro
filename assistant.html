<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RentPro — AI Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c1022">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    .chat { display: flex; flex-direction: column; height: calc(100vh - 190px); min-height: 460px; max-width: 920px; background: var(--rp-surface); border: 1px solid var(--rp-border); border-radius: 18px; box-shadow: var(--rp-shadow); overflow: hidden; }
    .chat-log { flex: 1; overflow-y: auto; padding: 22px 22px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }

    .chat-empty { margin: auto; text-align: center; max-width: 560px; padding: 12px 4px 20px; }
    .chat-empty .orb { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 14px; display: grid; place-items: center; color: #fff; font-size: 1.5rem;
      background: radial-gradient(120% 120% at 100% 0%, #a78bfa, transparent 60%), linear-gradient(135deg, #6366f1, #4f46e5); box-shadow: 0 12px 30px rgba(79, 70, 229, 0.35); }
    .chat-empty h4 { font-weight: 800; margin-bottom: 6px; }
    .chat-empty p { color: var(--rp-muted); font-size: 0.9rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
    .chip { border: 1px solid var(--rp-border); background: var(--rp-surface-2); color: var(--rp-ink); border-radius: 999px; padding: 8px 14px; font-size: 0.84rem; font-weight: 500; transition: border-color 0.15s, background 0.15s; text-align: left; }
    .chip:hover { border-color: rgba(var(--rp-primary-rgb), 0.5); background: var(--rp-primary-soft); }
    .chip i { color: var(--rp-primary); margin-right: 6px; }

    .msg { display: flex; gap: 10px; max-width: 88%; animation: msgIn 0.18s ease-out; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .bubble { padding: 11px 15px; border-radius: 16px; font-size: 0.92rem; line-height: 1.55; word-wrap: break-word; min-width: 0; }
    .msg.user .bubble { background: var(--rp-primary); color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap; }
    .msg.ai .bubble { background: var(--rp-surface-2); border: 1px solid var(--rp-border); color: var(--rp-text); border-bottom-left-radius: 6px; }
    .msg.ai.error .bubble { background: var(--rp-danger-soft); border-color: #fecaca; color: #991b1b; }
    .msg .bubble p { margin: 0 0 8px; } .msg .bubble p:last-child { margin-bottom: 0; }
    .msg .bubble ul { margin: 4px 0 8px; padding-left: 1.2rem; } .msg .bubble li { margin-bottom: 3px; }
    .msg .bubble strong { color: var(--rp-ink); }
    .ai-avatar { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-size: 0.8rem; background: linear-gradient(135deg, #6366f1, #7c3aed); }
    .msg-tools { margin-top: 6px; display: flex; gap: 6px; }
    .msg-tools button { border: 0; background: transparent; color: var(--rp-muted); font-size: 0.76rem; padding: 2px 6px; border-radius: 6px; }
    .msg-tools button:hover { background: #eef0f5; color: var(--rp-ink); }
    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #a5b4fc; animation: dot 1.1s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: 0.15s; } .typing span:nth-child(3) { animation-delay: 0.3s; }

    .chat-input { border-top: 1px solid var(--rp-border); padding: 12px; background: #fff; }
    .chat-input form { display: flex; gap: 8px; align-items: flex-end; background: var(--rp-surface-2); border: 1px solid var(--rp-border); border-radius: 14px; padding: 6px 6px 6px 14px; transition: border-color 0.15s, box-shadow 0.15s; }
    .chat-input form:focus-within { border-color: rgba(var(--rp-primary-rgb), 0.6); box-shadow: 0 0 0 4px rgba(var(--rp-primary-rgb), 0.12); }
    .chat-input textarea { flex: 1; border: 0; background: transparent; resize: none; outline: none; font-size: 0.94rem; line-height: 1.45; max-height: 140px; padding: 7px 0; }
    .chat-input .send { width: 40px; height: 40px; border-radius: 11px; padding: 0; flex-shrink: 0; }
    .chat-note { font-size: 0.74rem; color: var(--rp-subtle); text-align: center; margin-top: 8px; }

    @keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes dot { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
    @media (max-width: 991.98px) {
      .chat { height: calc(100dvh - 64px - var(--rp-safe-top) - var(--rp-tabbar-h) - var(--rp-safe-bottom) - 150px); min-height: 380px; border-radius: 16px; }
      .chat-log { padding: 16px 14px 6px; }
      .msg { max-width: 94%; }
    }
    @media (max-width: 767.98px) { .page-head p { display: none; } }
  </style>
</head>
<body data-page="assistant">
  <script src="js/splash.js"></script>
  <script src="js/shell.js"></script>

  <main class="content">
    <div class="page-head">
      <div>
        <div class="eyebrow"><i class="fa-solid fa-wand-magic-sparkles me-1"></i><span id="engineLabel">Works from your records</span></div>
        <h2>AI Assistant</h2>
        <p>Ask about your tenants, rent, payments and expenses in plain language.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-outline-secondary" id="newChatBtn"><i class="fa-solid fa-plus me-2"></i>New chat</button>
      </div>
    </div>

    <section class="chat" aria-label="AI assistant conversation">
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <div class="chat-input">
        <form id="chatForm">
          <textarea id="chatInput" rows="1" placeholder="Ask anything about your property…" aria-label="Your question" maxlength="2000"></textarea>
          <button type="submit" class="btn btn-primary send" id="sendBtn" aria-label="Send"><i class="fa-solid fa-arrow-up"></i></button>
        </form>
        <div class="chat-note">AI answers can be wrong. Check important figures on the Payments and Tenants pages.</div>
      </div>
    </section>
  </main>

  <script src="global.js"></script>
  <script src="js/dev-auth.js"></script>
  <script type="module" src="js/require-auth.js"></script>
  <script>
    const STORE = 'rentpro_ai_chat';
    const SUGGESTIONS = [
      ['fa-circle-exclamation', "Who hasn't paid rent this month?"],
      ['fa-sack-dollar', 'How much did I collect last month?'],
      ['fa-user-clock', 'Which tenants owe more than one month of rent?'],
      ['fa-receipt', 'Summarise this month\'s expenses'],
      ['fa-chart-line', 'How is rent collection trending over the last 3 months?'],
      ['fa-hourglass-half', 'Which tenants have only paid part of their rent?']
    ];
    const log = document.getElementById('chatLog');
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    let history = [];
    try { history = JSON.parse(sessionStorage.getItem(STORE) || '[]'); } catch (error) { history = []; }
    let busy = false;

    const save = () => { try { sessionStorage.setItem(STORE, JSON.stringify(history.slice(-20))); } catch (error) { /* optional */ } };

    function renderEmpty() {
      log.innerHTML = `
        <div class="chat-empty">
          <div class="orb"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
          <h4>How can I help with your property today?</h4>
          <p>I read your live RentPro data (tenants, balances, payments and expenses) to answer. Try one of these:</p>
          <div class="chips">${SUGGESTIONS.map(([icon, text]) => `<button type="button" class="chip" data-q="${escapeHtml(text)}"><i class="fa-solid ${icon}"></i>${escapeHtml(text)}</button>`).join('')}</div>
        </div>`;
    }

    function addMessage(role, text, { error = false } = {}) {
      log.querySelector('.chat-empty')?.remove();
      const el = document.createElement('div');
      el.className = `msg ${role === 'user' ? 'user' : 'ai'}${error ? ' error' : ''}`;
      if (role === 'user') {
        el.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      } else {
        el.innerHTML = `<div class="ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
          <div class="min-w-0"><div class="bubble">${error ? escapeHtml(text) : renderAiText(text)}</div>
          ${error ? '' : `<div class="msg-tools"><button type="button" data-copy><i class="fa-regular fa-copy me-1"></i>Copy</button></div>`}</div>`;
        const copy = el.querySelector('[data-copy]');
        if (copy) copy.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(text); copy.innerHTML = '<i class="fa-solid fa-check me-1"></i>Copied'; }
          catch (e) { copy.innerText = 'Copy failed'; }
          setTimeout(() => { copy.innerHTML = '<i class="fa-regular fa-copy me-1"></i>Copy'; }, 1500);
        });
      }
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'msg ai';
      el.innerHTML = `<div class="ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></div><div class="bubble"><span class="typing" aria-label="Thinking"><span></span><span></span><span></span></span></div>`;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function ask(question) {
      question = question.trim();
      if (!question || busy) return;
      busy = true;
      sendBtn.disabled = true;
      input.value = '';
      autoSize();
      addMessage('user', question);
      const typing = showTyping();
      // Short history keeps the request small (it travels in the URL to Apps Script).
      const recent = history.slice(-4).map(turn => ({ role: turn.role, content: turn.content.slice(0, 600) }));
      try {
        const result = await apiRequest({ action: 'aiAssist', mode: 'ask', question, history: recent });
        typing.remove();
        const text = ((result.data && result.data.text) || 'No answer came back. Please try again.') +
            (result.data && result.data.notice ? '\n\n_' + result.data.notice + '_' : '');
        const engines = { gemini: 'Powered by Google Gemini', claude: 'Powered by Claude', free: 'Free built-in assistant' };
        if (result.data && engines[result.data.engine]) document.getElementById('engineLabel').innerText = engines[result.data.engine];
        addMessage('assistant', text);
        history.push({ role: 'user', content: question }, { role: 'assistant', content: text });
        save();
      } catch (error) {
        typing.remove();
        addMessage('assistant', error.message || 'Something went wrong. Please try again.', { error: true });
      } finally {
        busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function autoSize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }

    document.getElementById('chatForm').addEventListener('submit', (event) => { event.preventDefault(); ask(input.value); });
    input.addEventListener('input', autoSize);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); ask(input.value); }
    });
    log.addEventListener('click', (event) => {
      const chip = event.target.closest('.chip');
      if (chip) ask(chip.dataset.q);
    });
    document.getElementById('newChatBtn').addEventListener('click', () => {
      history = [];
      save();
      renderEmpty();
      input.focus();
    });

    // Restore this visit's conversation, or show suggestions.
    if (history.length) history.forEach(turn => addMessage(turn.role, turn.content));
    else renderEmpty();
  </script>
</body>
</html>
