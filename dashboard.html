<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RentPro — Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { 
        --rp-primary: #2563eb; 
        --rp-bg: #f8fafc; 
        --rp-dark: #0f172a; 
        --rp-card-border: #e2e8f0;
    }
    body { background: var(--rp-bg); font-family: 'Inter', system-ui, sans-serif; color: #334155; }

    /* HEADER */
    .top-header { background: var(--rp-dark); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .brand-logo { color: white; font-weight: 700; font-size: 1.25rem; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    
    /* NAV DROPDOWN */
    .nav-dropdown-container { position: relative; }
    .nav-select-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-width: 200px; font-weight: 500; transition: all 0.2s ease; }
    .nav-select-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.4); }
    .nav-menu { position: absolute; top: 115%; right: 0; width: 220px; background: white; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border: 1px solid var(--rp-card-border); display: none; flex-direction: column; overflow: hidden; z-index: 1001; }
    .nav-menu.show { display: flex; animation: fadeIn 0.2s ease-out; }
    .nav-item { padding: 12px 20px; text-decoration: none; color: #475569; font-weight: 500; display: flex; align-items: center; gap: 12px; transition: background 0.1s; border-bottom: 1px solid #f1f5f9; }
    .nav-item:hover { background: #f8fafc; color: var(--rp-primary); }
    .nav-item.active { background: #eff6ff; color: var(--rp-primary); border-left: 4px solid var(--rp-primary); }
    .nav-item.logout { color: #ef4444; }

    /* LAYOUT */
    .content { padding: 30px 5%; max-width: 1400px; margin: 0 auto; }
    .card-hero { background: white; border-radius: 16px; padding: 24px; border: 1px solid #e2e8f0; height: 100%; transition: transform 0.2s; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); }
    .card-hero:hover { transform: translateY(-3px); border-color: var(--rp-primary); }
    .card-label { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: #64748b; letter-spacing: 1px; margin-bottom: 8px; }
    .card-value { font-size: 2rem; font-weight: 800; color: #0f172a; margin: 0; }
    
    .icon-box { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .bg-blue-light { background: #eff6ff; color: #3b82f6; }
    .bg-purple-light { background: #f3e8ff; color: #a855f7; }
    .bg-green-light { background: #f0fdf4; color: #22c55e; }
    .bg-orange-light { background: #fff7ed; color: #f97316; }

    .activity-list { list-style: none; padding: 0; margin: 0; }
    .activity-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: #f8fafc; color: #475569; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-right: 15px; border: 1px solid #e2e8f0; }

    .welcome-banner { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border-radius: 16px; padding: 30px; color: white; margin-bottom: 30px; position: relative; overflow: hidden; }
    .welcome-bg { position: absolute; right: -20px; bottom: -40px; font-size: 10rem; opacity: 0.1; transform: rotate(-15deg); }

    /* PROPERTY SELECTOR */
    .property-bar { background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header class="top-header">
    <a href="#" class="brand-logo"><i class="fa-solid fa-building me-2"></i> RentPro</a>
    <div class="nav-dropdown-container">
        <div class="nav-select-btn" id="navDropdownBtn" onclick="toggleNav()">
            <span><i class="fa-solid fa-chart-pie me-2"></i> Dashboard</span>
            <i class="fa-solid fa-chevron-down small"></i>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="dashboard.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="tenants.html" class="nav-item"><i class="fa-solid fa-users"></i> Tenants</a>
            <a href="utilities.html" class="nav-item"><i class="fa-solid fa-faucet-drip"></i> Utilities</a>
            <a href="payments.html" class="nav-item"><i class="fa-solid fa-money-bill-wave"></i> Payments</a>
            <a href="expenses.html" class="nav-item"><i class="fa-solid fa-receipt"></i> Expenses</a>
            <a href="reports.html" class="nav-item"><i class="fa-solid fa-chart-column"></i> Reports</a>
            <a href="#" class="nav-item logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>
  </header>

  <main class="content">
    <div class="welcome-banner">
        <div style="position: relative; z-index: 2;">
            <h2 class="fw-bold mb-1" id="welcomeHeader">Dashboard</h2>
            <p class="mb-0 opacity-75" id="currentDate">Overview</p>
        </div>
        <i class="fa-solid fa-city welcome-bg"></i>
    </div>
    
    <div class="row g-4 mb-4">
      <div class="col-md-3">
          <div class="card-hero">
              <div class="d-flex justify-content-between">
                  <div><div class="card-label">Active Tenants</div><h3 id="totalTenants" class="card-value">0</h3></div>
                  <div class="icon-box bg-blue-light"><i class="fa-solid fa-users"></i></div>
              </div>
          </div>
      </div>
      <div class="col-md-3">
          <div class="card-hero">
              <div class="d-flex justify-content-between">
                  <div><div class="card-label">Expected Rent</div><h3 id="totalRent" class="card-value">0</h3></div>
                  <div class="icon-box bg-purple-light"><i class="fa-solid fa-bullseye"></i></div>
              </div>
          </div>
      </div>
      <div class="col-md-3">
          <div class="card-hero">
              <div class="d-flex justify-content-between">
                  <div><div class="card-label">Collected</div><h3 id="totalCollected" class="card-value text-success">0</h3></div>
                  <div class="icon-box bg-green-light"><i class="fa-solid fa-wallet"></i></div>
              </div>
          </div>
      </div>
      <div class="col-md-3">
          <div class="card-hero">
              <div class="d-flex justify-content-between">
                  <div><div class="card-label">Transactions</div><h3 id="totalPayments" class="card-value">0</h3></div>
                  <div class="icon-box bg-orange-light"><i class="fa-solid fa-receipt"></i></div>
              </div>
          </div>
      </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card-hero">
                <h6 class="fw-bold mb-4" id="chartTitle">Main Property Analysis</h6>
                <div style="height: 300px;"><canvas id="revenueChart"></canvas></div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card-hero" style="height: 400px; overflow-y: auto;">
                <h6 class="fw-bold mb-4">Recent Payments</h6>
                <ul class="activity-list" id="recentActivityList">
                    <li class="text-center text-muted py-5 small">Loading...</li>
                </ul>
            </div>
        </div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    function toggleNav() { document.getElementById('navMenu').classList.toggle('show'); }
    window.onclick = function(event) {
        if (!event.target.closest('.nav-dropdown-container')) {
            var dropdowns = document.getElementsByClassName("nav-menu");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) dropdowns[i].classList.remove('show');
            }
        }
    }
</script>

<script src="global.js"></script>
<script src="js/dev-auth.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut as firebaseSignOut, onAuthStateChanged as firebaseOnAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBwJEOW3jVBHLizWiJjT4a_Tay-2yUCZwk", 
        authDomain: "rentpro-saas.firebaseapp.com",
        projectId: "rentpro-saas",
        storageBucket: "rentpro-saas.firebasestorage.app",
        messagingSenderId: "120985965272",
        appId: "1:120985965272:web:c86eae74aa75460b17fdad"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let currentUserUID = null;
    let globalTenants = [];
    let globalPayments = [];

    // 🔴 REPLACE WITH YOUR NEW WEB APP URL
    const WEB_APP_URL = window.API_URL;

    RentProDevAuth.onAuthStateChanged(auth, (user) => {
        if (!user) { window.location.href = "index.html"; } 
        else {
            currentUserUID = user.uid;
            const displayName = user.displayName || user.email.split('@')[0];
            const formattedName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
            document.getElementById('welcomeHeader').innerText = `Welcome, ${formattedName}!`;
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-GB', { dateStyle: 'full' });
            loadDashboard();
        }
    }, firebaseOnAuthStateChanged);

    const $ = (id) => document.getElementById(id);
    const money = (val) => new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES', minimumFractionDigits: 0 }).format(Number(val)||0).replace('KES','').trim();

    async function apiFetch(params = {}) {
        const url = new URL(WEB_APP_URL);
        params.t = new Date().getTime(); 
        Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
        try {
            const response = await fetch(url);
            return await response.json();
        } catch (error) { console.error(error); return []; }
    }

    let revenueChartInstance = null;

    // --- MAIN DASHBOARD LOGIC ---
    window.loadDashboard = async function() {
        if(!currentUserUID) return;
        
        const [tenantsRes, paymentsRes] = await Promise.all([
            apiFetch({ action: 'getTenants' }),
            apiFetch({ action: 'getPayments' })
        ]);
        
        globalTenants = tenantsRes.data || [];
        let rawPayments = (paymentsRes.data || []);

        const tenantMap = {}; 
        globalTenants.forEach(t => {
            let p = String(t.Phone).replace(/\D/g, '');
            if(p) tenantMap[p] = t.Property || "Main Property"; 
        });

        globalPayments = rawPayments.filter(p => {
            const pPhone = String(p.MSISDN || p.Phone || "").replace(/\D/g, '');
            return Object.keys(tenantMap).some(tp => pPhone.includes(tp));
        }).map(p => {
            const pPhone = String(p.MSISDN || p.Phone || "").replace(/\D/g, '');
            let foundProp = "Unassigned";
            for(let tp in tenantMap) { 
                if(pPhone.includes(tp)) { foundProp = tenantMap[tp]; break; }
            }
            return { ...p, assignedProperty: foundProp };
        });

        renderPropertyAnalysis();
    }

    function renderPropertyAnalysis() {
        const fTenants = globalTenants;
        const fPayments = globalPayments;
        $('chartTitle').innerText = 'Main Property Analysis';

        // Calculate Stats
        const tRent = fTenants.reduce((s, t) => s + Number(t.Rent || 0), 0);
        const tColl = fPayments.reduce((s, p) => s + Number(p.Amount || 0), 0);

        $('totalTenants').innerText = fTenants.length;
        $('totalRent').innerText = money(tRent);
        $('totalPayments').innerText = fPayments.length; 
        $('totalCollected').innerText = money(tColl);

        renderChart(fPayments);
        renderRecentActivity(fPayments);
    }

    function renderRecentActivity(payments) {
        const list = $('recentActivityList');
        if (!payments.length) {
            list.innerHTML = `<li class="text-center text-muted py-5 small">No activity found.</li>`;
            return;
        }
        
        const sorted = [...payments].sort((a, b) => new Date(b.Date || b.date) - new Date(a.Date || a.date));

        list.innerHTML = sorted.slice(0, 10).map(p => {
            const name = p['M-Pesa Name'] || p['TenantName'] || p['Name'] || 'Unknown';
            const initial = name.charAt(0).toUpperCase();
            
            let dStr = p.Date || p.date || 'Today';
            try { dStr = new Date(dStr).toLocaleDateString('en-GB', {month:'short', day:'numeric'}); } catch(e){}

            const amount = p.Amount || p.amount || 0;
            const propLabel = p.assignedProperty && p.assignedProperty !== "Unassigned" 
                ? `<span class="badge bg-light text-dark border ms-2" style="font-size:0.6rem">${p.assignedProperty}</span>` 
                : '';

            return `
            <li class="activity-item">
                <div class="d-flex align-items-center">
                    <div class="avatar-circle">${initial}</div>
                    <div>
                        <div class="fw-bold text-dark small">${name} ${propLabel}</div>
                        <div class="text-muted" style="font-size:0.75rem">${dStr}</div>
                    </div>
                </div>
                <div class="fw-bold text-success">+${money(amount)}</div>
            </li>`;
        }).join('');
    }

    function renderChart(payments) {
        const ctx = document.getElementById('revenueChart').getContext('2d');
        const monthlyData = {};
        
        payments.forEach(p => {
            try {
                const dateVal = p.Date || p.date || p.Timestamp;
                if(dateVal) {
                    const d = new Date(dateVal);
                    const key = d.toLocaleString('default', { month: 'short' });
                    monthlyData[key] = (monthlyData[key] || 0) + Number(p.Amount || p.amount || 0);
                }
            } catch(e) {}
        });

        const labels = Object.keys(monthlyData);
        const data = Object.values(monthlyData);

        if (revenueChartInstance) revenueChartInstance.destroy();

        revenueChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels.length ? labels : ['No Data'],
                datasets: [{
                    label: 'Monthly Rent Collection',
                    data: data.length ? data : [0],
                    backgroundColor: '#2563eb',
                    borderRadius: 4,
                    barThickness: 25
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { borderDash: [4, 4] } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    if($('logoutBtn')) $('logoutBtn').addEventListener('click', () => RentProDevAuth.signOut(auth, firebaseSignOut));
</script>
</body>
</html>
