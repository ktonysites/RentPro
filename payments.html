<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RentPro — Payments</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c1022">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body data-page="payments">
  <script src="js/shell.js"></script>


  <main class="content">
    <div class="page-head">
      <div>
        <h2 class="fw-bold mb-1 text-dark">Payment History</h2>
        <p class="text-muted small m-0">Real-time log of incoming transactions.</p>
      </div>
      <div class="page-actions">
          <a href="reconcile.html" class="btn btn-outline-warning" id="unmatchedBtn">
            <i class="fa-solid fa-triangle-exclamation me-2"></i> Unmatched <span id="unmatchedCount" class="badge bg-warning text-dark ms-1">0</span>
          </a>
          <button onclick="downloadCSV()" class="btn btn-outline-success">
            <i class="fa-solid fa-file-csv me-2"></i> Export
          </button>
          <button onclick="loadPayments()" class="btn btn-outline-primary">
            <i class="fa-solid fa-rotate me-2"></i> Refresh
          </button>
      </div>
    </div>

    <div class="card-table">
      <div class="table-responsive">
        <table class="table table-stack table-hover mb-0">
          <thead>
            <tr>
              <th>Date</th>
              <th>Reference</th>
              <th>Payer Name</th>
              <th>Match Status</th>
              <th class="text-end">Amount</th>
            </tr>
          </thead>
          <tbody id="paymentTableBody">
             <tr>
               <td colspan="5" class="text-center p-5 text-muted">
                 <i class="fa-solid fa-circle-notch fa-spin fs-4 mb-2"></i><br>Syncing transactions...
               </td>
             </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <script src="global.js"></script>
    <script src="js/dev-auth.js"></script>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged as firebaseOnAuthStateChanged, signOut as firebaseSignOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBwJEOW3jVBHLizWiJjT4a_Tay-2yUCZwk",
        authDomain: "rentpro-saas.firebaseapp.com",
        projectId: "rentpro-saas",
        storageBucket: "rentpro-saas.firebasestorage.app",
        messagingSenderId: "120985965272",
        appId: "1:120985965272:web:c86eae74aa75460b17fdad",
        measurementId: "G-LJRKHT6ZTD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let currentUserUID = null;
    let currentPayments = []; // Store for Export

    // 🔴 YOUR WEB APP URL 🔴
    const WEB_APP_URL = window.API_URL;

    RentProDevAuth.onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserUID = user.uid;
            loadPayments();
        } else {
            window.location.href = "index.html";
        }
    }, firebaseOnAuthStateChanged);

    const money = (amount) => {
        return new Intl.NumberFormat('en-KE', { 
            style: 'currency', currency: 'KES', minimumFractionDigits: 0 
        }).format(amount).replace('KES', '').trim();
    };

    // Helper: Normalize keys to handle case sensitivity
    function normalizeData(item) {
        const newItem = {};
        Object.keys(item).forEach(key => {
            const cleanKey = key.toLowerCase().replace(/[^a-z0-9]/g, ''); 
            newItem[cleanKey] = item[key];
        });
        return newItem;
    }

    window.loadPayments = async function() {
        const tbody = document.getElementById('paymentTableBody');
        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-5 text-muted"><i class="fa-solid fa-circle-notch fa-spin fs-4 mb-2"></i><br>Syncing transactions...</td></tr>`;

        try {
            const res = await fetch(`${WEB_APP_URL}?action=getPayments&t=${new Date().getTime()}`);
            const json = await res.json();
            const rawData = Array.isArray(json) ? json : (json.data || []);

            // Normalize
            let payments = rawData.map(normalizeData);

            // 🔴 FILTER BY USER ID 🔴
            // This installation contains one property's payment history.
            
            // Store for CSV Export
            currentPayments = payments;
            const unmatchedCount = payments.filter(p => /unmatched|unassigned/i.test(p.notes || '')).length;
            document.getElementById('unmatchedCount').innerText = unmatchedCount;
            updateUnmatchedBadge(unmatchedCount);

            // Sort by Date (Newest First)
            payments.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

            tbody.innerHTML = "";

            if (payments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-5 text-muted">No payment history found.</td></tr>`;
                return;
            }

            payments.forEach(p => {
                // Access normalized keys
                let dateDisplay = p.date || '-';
                try { 
                    const d = new Date(p.date);
                    if(!isNaN(d)) dateDisplay = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
                } catch(e){}

                const name = p.tenant || p.payer || 'Unknown';
                const ref = p.reference || p.method || 'MANUAL';
                const status = p.notes || 'Confirmed';
                const amount = p.amount || 0;
                const house = p.house ? `<div class="small text-muted">House ${escapeHtml(p.house)}</div>` : '';
                const statusBadge = /unmatched|unassigned/i.test(status)
                    ? `<a href="reconcile.html" class="badge-status is-warning text-decoration-none">${escapeHtml(status)}</a>`
                    : `<span class="badge-status">${escapeHtml(status)}</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td data-label="Date" class="text-muted small fw-bold">${dateDisplay}</td>
                        <td data-label="Reference"><span class="badge-ref">${escapeHtml(ref)}</span></td>
                        <td class="td-primary fw-bold text-dark">${escapeHtml(name)}${house}</td>
                        <td data-label="Status">${statusBadge}</td>
                        <td data-label="Amount" class="text-end fw-bold text-success">${money(amount)}</td>
                    </tr>`;
            });

        } catch(e) {
            console.error(e);
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger p-4">Error loading data.</td></tr>`;
        }
    }

    // --- CSV EXPORT FUNCTION ---
    window.downloadCSV = () => {
        if(currentPayments.length === 0) { alert("No data to export."); return; }

        const quote = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
        let csvContent = "Date,Reference,Tenant,House,Payer,Method,Amount,Status\n";

        currentPayments.forEach(p => {
            let dateStr = p.date || '';
            try { dateStr = new Date(p.date).toISOString().split('T')[0]; } catch(e){}
            csvContent += [dateStr, p.reference, p.tenant, p.house, p.payer, p.method, p.amount || 0, p.notes || 'Confirmed'].map(quote).join(",") + "\n";
        });

        // A Blob keeps '#' in references from truncating the file, which a data: URI would.
        const link = document.createElement("a");
        link.setAttribute("href", URL.createObjectURL(new Blob([csvContent], { type: "text/csv" })));
        link.setAttribute("download", "RentPro_Payments.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    if(document.getElementById('logoutBtn')) {
        document.getElementById('logoutBtn').addEventListener('click', () => RentProDevAuth.signOut(auth, firebaseSignOut));
    }
  </script>
</body>
</html>
