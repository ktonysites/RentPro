<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RentPro — Payments</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { 
        --rp-primary: #2563eb; 
        --rp-bg: #f8fafc; 
        --rp-dark: #0f172a; 
        --rp-card-border: #e2e8f0;
    }
    body { background: var(--rp-bg); font-family: 'Inter', system-ui, sans-serif; color: #334155; }

    /* --- TOP HEADER & DROPDOWN --- */
    .top-header {
        background: var(--rp-dark);
        padding: 15px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .brand-logo {
        color: white;
        font-weight: 700;
        font-size: 1.25rem;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .nav-dropdown-container { position: relative; }

    .nav-select-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-width: 200px;
        font-weight: 500;
        transition: all 0.2s ease;
    }

    .nav-select-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.4);
    }

    .nav-menu {
        position: absolute;
        top: 115%;
        right: 0;
        width: 220px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--rp-card-border);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 1001;
    }

    .nav-menu.show { display: flex; animation: fadeIn 0.2s ease-out; }

    .nav-item {
        padding: 12px 20px;
        text-decoration: none;
        color: #475569;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: background 0.1s;
        border-bottom: 1px solid #f1f5f9;
    }

    .nav-item:hover { background: #f8fafc; color: var(--rp-primary); }
    .nav-item.active { background: #eff6ff; color: var(--rp-primary); border-left: 4px solid var(--rp-primary); }
    .nav-item.logout { color: #ef4444; }

    /* --- LAYOUT & TABLE STYLES --- */
    .content { 
        padding: 30px 5%; 
        max-width: 1400px;
        margin: 0 auto;
    }

    .card-table { 
        background: #fff; 
        border: 1px solid var(--rp-card-border); 
        border-radius: 12px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
        overflow: hidden; 
    }

    .table thead th { 
        background: #f8fafc; 
        font-weight: 700; 
        text-transform: uppercase; 
        font-size: 0.75rem; 
        color: #64748b; 
        padding: 16px; 
        border-bottom: 1px solid #e2e8f0; 
        letter-spacing: 0.5px;
        white-space: nowrap; 
    }

    .table tbody td { 
        padding: 16px; 
        border-bottom: 1px solid #f1f5f9; 
        vertical-align: middle; 
    }
    
    .table-hover tbody tr:hover { background-color: #f8fafc; }

    /* Badges */
    .badge-ref { background: #f1f5f9; color: #475569; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; border: 1px solid #e2e8f0; }
    .badge-status { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* Mobile Tweaks */
    @media (max-width: 768px) { 
        .content { padding: 20px 4%; } 
        .page-header { flex-direction: column; align-items: flex-start; gap: 15px; }
        .page-actions { width: 100%; display: flex; gap: 10px; }
        .page-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <a href="#" class="brand-logo">
        <i class="fa-solid fa-building me-2"></i> RentPro
    </a>

    <div class="nav-dropdown-container">
        <div class="nav-select-btn" id="navDropdownBtn" onclick="toggleNav()">
            <span><i class="fa-solid fa-money-bill-wave me-2"></i> Payments</span>
            <i class="fa-solid fa-chevron-down small"></i>
        </div>

        <div class="nav-menu" id="navMenu">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-chart-pie"></i> Dashboard
            </a>
            <a href="tenants.html" class="nav-item">
                <i class="fa-solid fa-users"></i> Tenants
            </a>
            <a href="payments.html" class="nav-item active">
                <i class="fa-solid fa-money-bill-wave"></i> Payments
            </a>
            <a href="expenses.html" class="nav-item">
                <i class="fa-solid fa-receipt"></i> Expenses
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fa-solid fa-chart-column"></i> Reports
            </a>
            <a href="#" class="nav-item logout" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </div>
  </header>

  <main class="content">
    <div class="d-flex justify-content-between align-items-center mb-4 page-header">
      <div>
        <h2 class="fw-bold mb-1 text-dark">Payment History</h2>
        <p class="text-muted small m-0">Real-time log of incoming transactions.</p>
      </div>
      <div class="d-flex gap-2 page-actions">
          <button onclick="downloadCSV()" class="btn btn-outline-success">
            <i class="fa-solid fa-file-csv me-2"></i> Export
          </button>
          <button onclick="loadPayments()" class="btn btn-outline-primary">
            <i class="fa-solid fa-rotate me-2"></i> Refresh
          </button>
      </div>
    </div>

    <div class="card-table">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Date</th>
              <th>Reference</th>
              <th>Payer Name</th>
              <th>Match Status</th>
              <th class="text-end">Amount</th>
            </tr>
          </thead>
          <tbody id="paymentTableBody">
             <tr>
               <td colspan="5" class="text-center p-5 text-muted">
                 <i class="fa-solid fa-circle-notch fa-spin fs-4 mb-2"></i><br>Syncing transactions...
               </td>
             </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function toggleNav() {
        document.getElementById('navMenu').classList.toggle('show');
    }
    // Close dropdown when clicking outside
    window.onclick = function(event) {
        if (!event.target.closest('.nav-dropdown-container')) {
            var dropdowns = document.getElementsByClassName("nav-menu");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBwJEOW3jVBHLizWiJjT4a_Tay-2yUCZwk",
        authDomain: "rentpro-saas.firebaseapp.com",
        projectId: "rentpro-saas",
        storageBucket: "rentpro-saas.firebasestorage.app",
        messagingSenderId: "120985965272",
        appId: "1:120985965272:web:c86eae74aa75460b17fdad",
        measurementId: "G-LJRKHT6ZTD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let currentUserUID = null;
    let currentPayments = []; // Store for Export

    // 🔴 YOUR WEB APP URL 🔴
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzsWx1USYqSBOGLttP8GibfJdSfRLu9bDGSGiuOGj1TuI88gH7nTXJTZqy0Iwd3oMg2_w/exec"; 

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserUID = user.uid;
            loadPayments();
        } else {
            window.location.href = "index.html";
        }
    });

    const money = (amount) => {
        return new Intl.NumberFormat('en-KE', { 
            style: 'currency', currency: 'KES', minimumFractionDigits: 0 
        }).format(amount).replace('KES', '').trim();
    };

    // Helper: Normalize keys to handle case sensitivity
    function normalizeData(item) {
        const newItem = {};
        Object.keys(item).forEach(key => {
            const cleanKey = key.toLowerCase().replace(/[^a-z0-9]/g, ''); 
            newItem[cleanKey] = item[key];
        });
        return newItem;
    }

    window.loadPayments = async function() {
        const tbody = document.getElementById('paymentTableBody');
        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-5 text-muted"><i class="fa-solid fa-circle-notch fa-spin fs-4 mb-2"></i><br>Syncing transactions...</td></tr>`;

        try {
            const res = await fetch(`${WEB_APP_URL}?action=getPayments&t=${new Date().getTime()}`);
            const json = await res.json();
            const rawData = Array.isArray(json) ? json : (json.data || []);

            // Normalize
            let payments = rawData.map(normalizeData);

            // 🔴 FILTER BY USER ID 🔴
            payments = payments.filter(p => p.uid === currentUserUID);
            
            // Store for CSV Export
            currentPayments = payments;

            // Sort by Date (Newest First)
            payments.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

            tbody.innerHTML = "";

            if (payments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-5 text-muted">No payment history found.</td></tr>`;
                return;
            }

            payments.forEach(p => {
                // Access normalized keys
                let dateDisplay = p.date || '-';
                try { 
                    const d = new Date(p.date);
                    if(!isNaN(d)) dateDisplay = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
                } catch(e){}

                const name = p.mpesaname || p.tenantname || p.name || 'Unknown';
                const ref = p.refcode || p.reference || p.ref || 'MANUAL';
                const status = p.matchstatus || 'Confirmed';
                const amount = p.amount || 0;

                tbody.innerHTML += `
                    <tr>
                        <td class="text-muted small fw-bold">${dateDisplay}</td>
                        <td><span class="badge-ref">${ref}</span></td>
                        <td class="fw-bold text-dark">${name}</td>
                        <td><span class="badge-status">${status}</span></td>
                        <td class="text-end fw-bold text-success">${money(amount)}</td>
                    </tr>`;
            });

        } catch(e) {
            console.error(e);
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger p-4">Error loading data.</td></tr>`;
        }
    }

    // --- CSV EXPORT FUNCTION ---
    window.downloadCSV = () => {
        if(currentPayments.length === 0) { alert("No data to export."); return; }

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Date,Reference,Payer Name,Amount,Status\n";

        currentPayments.forEach(p => {
            let dateStr = p.date || '';
            try { dateStr = new Date(p.date).toISOString().split('T')[0]; } catch(e){}
            
            const name = p.mpesaname || p.tenantname || p.name || '';
            const ref = p.refcode || p.reference || p.ref || '';
            const amount = p.amount || 0;
            const status = p.matchstatus || 'Confirmed';

            // Wrap text in quotes to handle commas
            const row = `"${dateStr}","${ref}","${name}",${amount},"${status}"`;
            csvContent += row + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "RentPro_Payments.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    if(document.getElementById('logoutBtn')) {
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
    }
  </script>
</body>
</html>
